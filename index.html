<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes refinadas: serif para el logo y sans-serif geométrica para el cuerpo -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-lime: #c5ed82;
            --text-dark: #1a1a1a;
        }
        body { 
            font-family: 'Hanken Grotesk', sans-serif; 
            color: var(--text-dark);
        }
        .serif-logo { 
            font-family: 'DM Serif Display', serif; 
            letter-spacing: -0.05em;
        }
        .bg-brand-lime { background-color: var(--brand-lime); }
        .border-brand-lime { border-color: var(--brand-lime); }
        
        /* Ajuste fino para la tipografía de los botones */
        .btn-text {
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }
    </style>
</head>
<body class="bg-gray-50 flex justify-center items-start min-h-screen antialiased">

    <div class="max-w-[450px] w-full bg-white shadow-xl min-h-screen flex flex-col">
        
        <!-- Barra superior -->
        <div class="bg-brand-lime text-center py-2.5 px-4">
            <p class="text-[13px] font-medium text-black">
                The most affordable FDA-approved semaglutide
            </p>
        </div>

        <!-- Logo -->
        <div class="px-7 py-5">
            <h1 class="serif-logo text-[42px] leading-none text-black lowercase">hers</h1>
        </div>

        <!-- Imagen Hero (Screenshot 2026-05-05 at 16.41.08.jpg) -->
        <div class="relative w-full aspect-[4/3] bg-[#5a7646]">
            <!-- He insertado la referencia a tu archivo local -->
            <img src="Screenshot 2026-05-05 at 16.41.08.jpg" 
                 class="w-full h-full object-cover" 
                 alt="Hero section from Screenshot 2026-05-05 at 16.41.08.jpg">
        </div>

        <!-- Contenedor Principal con curva pronunciada -->
        <div class="bg-white -mt-10 relative rounded-t-[45px] px-8 pt-10 pb-16 flex-grow">
            
            <!-- Disclaimer pequeño -->
            <p class="text-gray-500 text-[11px] text-center mb-8 leading-relaxed font-normal">
                Wegovy® is the registered trademark of Novo Nordisk A/S.
            </p>

            <!-- Selector de pasos (Stepper) -->
            <div class="flex justify-center mb-10">
                <div class="bg-[#f2f4f0] rounded-full flex p-1.5 w-full max-w-[280px] items-center">
                    <div class="bg-brand-lime flex-1 rounded-full py-2.5 text-center text-[15px] font-semibold">1</div>
                    <div class="flex-1 text-center text-[15px] text-gray-400 font-medium">2</div>
                    <div class="flex-1 text-center text-[15px] text-gray-400 font-medium">3</div>
                </div>
            </div>

            <!-- Título de la pregunta -->
            <h2 class="text-[27px] font-semibold text-black leading-[1.2] mb-10 text-left">
                Do you have a treatment in mind already?
            </h2>

            <!-- Opciones de respuesta -->
            <div class="space-y-4">
                <button class="w-full border-[1.5px] border-gray-200 rounded-full py-4.5 px-8 text-center btn-text font-medium hover:bg-gray-50 active:scale-[0.98] transition-all py-4">
                    GLP-1 pills
                </button>
                <button class="w-full border-[1.5px] border-gray-200 rounded-full py-4.5 px-8 text-center btn-text font-medium hover:bg-gray-50 active:scale-[0.98] transition-all py-4">
                    GLP-1 injections
                </button>
                <button class="w-full border-[1.5px] border-gray-200 rounded-full py-4.5 px-8 text-center btn-text font-medium hover:bg-gray-50 active:scale-[0.98] transition-all py-4">
                    I'd like a provider recommendation
                </button>
            </div>
        </div>
    </div>

</body>
</html>
